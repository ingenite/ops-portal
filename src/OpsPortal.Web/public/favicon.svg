<!--
  OpsPortal favicon: a Lissajous curve with a 1:2 frequency ratio.
  Coordinates generated with a small PowerShell script, sampling
  64 segments over 0 to 2π, then scaled and centered in a 32×32 viewBox.
  Created as an SVG learning exercise with AI assistance.

function LissajousCurve {
  param(
    [double]$Step
  )
  $x = 16 + 11 * ([Math]::Sin($Step))
  $y = 16 - 11 * ([Math]::Sin(2 * $Step))
  "$($x.ToString("F2")) $($y.ToString("F2"))"
}

$step = (2 * ([Math]::PI)) / 64
for($i = 0; $i -le 64; $i++) {
  $t = $i * $step
  "L $(LissajousCurve -Step $t)"
}
-->